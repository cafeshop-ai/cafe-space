[package]
name = "cafe-space-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"

[workspace]
resolver = "3"

[dependencies]
cafe-space-ipc = { path = "../../crates/ipc" }
cafe-space-protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
semver = "1"
tauri = { version = "=2.11.6", features = [] }
tokio = { version = "1.54.1", features = ["io-util", "sync", "time", "macros"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[build-dependencies]
cafe-space-ipc = { path = "../../crates/ipc" }
serde_json = "1"
tauri-build = "=2.6.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
