[package]
name = "cafe-space-webrtc-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]
resolver = "3"

[dependencies]
async-trait = "0.1"
bytes = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "io-std", "io-util", "sync"] }
webrtc = "=0.21.1"
# SettingEngine argument types are not all re-exported by webrtc.
rtc = { version = "=0.21.1", default-features = false }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
