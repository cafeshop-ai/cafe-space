<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Café Space · New session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cs{--canvas:#251d15;--panel:#2d261f;--panel2:#332c25;--panel3:#3c352e;--hair:rgba(255,240,225,.075);--hair2:rgba(255,240,225,.14);--fg:#f3eee8;--fg2:#baafa4;--fg3:#a89f97;--brand:#dca36a;--brandsoft:rgba(220,163,106,.14);--fill:#a3632d;--onfill:#fff8f0;--ok:#5dbd88;--warn:#e1aa4b;--c1:#d4955d;--c2:#78a0cc;--c3:#85bb86;--sh3:0 18px 48px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.3);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;font-family:var(--sans)}
.cs.light{--canvas:#f5f3f0;--panel:#ffffff;--panel2:#faf8f6;--panel3:#f0ece7;--hair:rgba(60,40,20,.08);--hair2:rgba(60,40,20,.15);--fg:#1d1915;--fg2:#675e55;--fg3:#71675e;--brand:#995b27;--brandsoft:#f6ece1;--fill:#9f5f29;--onfill:#fffaf4;--ok:#28764b;--warn:#935e09;--c1:#b06a2f;--c2:#4e7ba8;--c3:#5c9860;--sh3:0 18px 48px rgba(29,25,21,.16),0 3px 8px rgba(29,25,21,.06)}
.cs button,.cs input{font:inherit;color:inherit}
.cs button{cursor:pointer}
a{color:#dca36a}a:hover{color:#e8b783}
</style>
</helmet>
<div class="cs {{themeClass}}" style="width: 720px; height: 760px; box-sizing: border-box; padding: 20px; background: var(--canvas); color: var(--fg)">
<section role="dialog" aria-modal="true" aria-labelledby="ns-title" style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 14px; border: 1px solid var(--hair2); background: var(--panel); box-shadow: var(--sh3)">
  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 14px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--brand)">New session</span>
      <h1 id="ns-title" style="margin: 0; font-family: var(--serif); font-weight: 400; font-size: 26px; letter-spacing: -.015em">Start an agent</h1>
    </div>
    <button type="button" aria-label="Close" style="width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; color: var(--fg2); display: inline-flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <form style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding: 4px 24px 0; overflow: hidden">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 13px; font-weight: 600">Project</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--brand); background: var(--brandsoft); cursor: pointer">
          <input type="radio" name="project" checked="" style="accent-color: #a3632d">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500">cafe-space</span><span style="font-family: var(--mono); font-size: 12px; color: var(--fg2)">~/code/cafe-space</span></span>
        </label>
        <label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--hair2); cursor: pointer">
          <input type="radio" name="project" style="accent-color: #a3632d">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px">pi-packages</span><span style="font-family: var(--mono); font-size: 12px; color: var(--fg2)">~/code/pi-packages</span></span>
        </label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 13px; font-weight: 600">Agent</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--brand); background: var(--brandsoft); cursor: pointer">
          <span style="display: flex; align-items: center; gap: 8px"><input type="radio" name="agent" checked="" style="accent-color: #a3632d"><span style="width: 26px; height: 26px; border-radius: 7px; background: color-mix(in srgb, var(--c2) 22%, transparent); color: var(--c2); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">Cx</span><span style="font-size: 14px; font-weight: 500">Codex</span></span>
          <span style="font-size: 12.5px; color: var(--ok)">Ready · 0.166</span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--hair2); cursor: pointer">
          <span style="display: flex; align-items: center; gap: 8px"><input type="radio" name="agent" style="accent-color: #a3632d"><span style="width: 26px; height: 26px; border-radius: 7px; background: color-mix(in srgb, var(--c3) 22%, transparent); color: var(--c3); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">Pi</span><span style="font-size: 14px">Pi</span></span>
          <span style="font-size: 12.5px; color: var(--ok)">Ready · 1.5</span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; border: 1px dashed var(--hair2); color: var(--fg2); cursor: not-allowed">
          <span style="display: flex; align-items: center; gap: 8px"><input type="radio" name="agent" disabled="" aria-describedby="claude-why"><span style="width: 26px; height: 26px; border-radius: 7px; background: color-mix(in srgb, var(--c1) 16%, transparent); color: var(--c1); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">Cl</span><span style="font-size: 14px">Claude Code</span></span>
          <span id="claude-why" style="font-size: 12.5px; color: var(--warn)">Sign in needed — run <code style="font-family: var(--mono)">claude</code> once</span>
        </label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 13px; font-weight: 600">Start as</legend>
      <div style="display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--panel3)">
        <label style="flex: 1; min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; background: var(--panel); font-size: 13.5px; font-weight: 500; cursor: pointer"><input type="radio" name="mode" checked="" style="accent-color: #a3632d">New</label>
        <label style="flex: 1; min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; font-size: 13.5px; color: var(--fg2); cursor: pointer"><input type="radio" name="mode" style="accent-color: #a3632d">Resume previous</label>
        <label style="flex: 1; min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; font-size: 13.5px; color: var(--fg2); cursor: pointer"><input type="radio" name="mode" style="accent-color: #a3632d">Attach to running</label>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="profile" style="font-size: 13px; font-weight: 600">Permission profile <span style="font-weight: 400; color: var(--fg2)">· Codex's own settings</span></label>
      <select id="profile" style="min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hair2); background: var(--panel2); color: var(--fg); font: inherit; font-size: 14px">
        <option>Ask before changes</option>
        <option>Read-only</option>
        <option>Full auto</option>
      </select>
      <span style="font-size: 12.5px; color: var(--fg2)">Reads freely. Asks before writing files or running commands.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="ns-name" style="font-size: 13px; font-weight: 600">Name <span style="font-weight: 400; color: var(--fg2)">· optional</span></label>
      <input id="ns-name" type="text" placeholder="Named from your first message" style="min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hair2); background: var(--panel2); font-size: 14px">
    </div>
  </form>

  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--hair)">
    <span style="flex: 1; font-size: 12.5px; color: var(--fg2)">Safe to retry — the same request never starts two sessions.</span>
    <button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; background: transparent; font-size: 14px; color: var(--fg2)">Cancel</button>
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 8px; background: var(--fill); color: var(--onfill); text-decoration: none; font-size: 14px; font-weight: 500">Start session</a>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":720,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.theme === 'light' ? 'light' : '' };
  }
}
</script>
</body>
</html>
