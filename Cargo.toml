[workspace]
resolver = "3"
members = [
  "crates/cafe-spaced",
  "crates/cafe-space-cli",
  "crates/adapters",
  "crates/protocol",
  "crates/ipc",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "net", "signal", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
