name: Native desktop transport

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: WebView IPC / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Intel coverage supplements, never substitutes for, the required Apple Silicon job.
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install native Linux WebView libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Build and test shared React UI
        shell: bash
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Build two daemon artifacts without executing either
        shell: bash
        run: |
          cargo rustc --locked -p cafe-spaced --bin cafe-spaced-dev -- -C metadata=cafe-space-m0-old
          node desktop/scripts/record-old-daemon.mjs
          cargo build --locked -p cafe-spaced --bin cafe-spaced-dev
          cargo build --locked -p cafe-space-cli --bin cafe-space-dev
      - name: Check desktop formatting and strict lint
        shell: bash
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test native IPC and Channel boundaries
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Prepare disposable Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
      - name: Real OS-manager install, both handovers and failed-target rollback
        env:
          CAFE_SPACE_TEST_HANDOVER: '1'
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml os_manager_install_update_and_rollback -- --ignored --test-threads=1 --nocapture
      - name: Check generated transport bindings
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- web/src/protocol/generated)" ]]; then
            git status --short -- web/src/protocol/generated
            exit 1
          fi
      - name: Test probe runner and prepare the owned fake Host harness
        shell: bash
        run: |
          node --test desktop/scripts/host-probe.test.mjs desktop/scripts/package-windows.test.mjs
          cargo test --locked -p cafe-spaced --test managed --no-run --message-format=json > target/desktop-host-artifacts.json
          CAFE_SPACE_TEST_DESKTOP=1 node desktop/scripts/host-disconnect.mjs
      - name: Build thin desktop shell with embedded daemon
        run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Real native WebView transport and fake Host chat probes
        if: runner.os != 'Linux'
        shell: bash
        env:
          CAFE_SPACE_TEST_DESKTOP: '1'
        run: |
          node desktop/scripts/probe.mjs
          node desktop/scripts/host-probe.mjs
      - name: Real native WebView transport and fake Host chat probes under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        env:
          CAFE_SPACE_TEST_DESKTOP: '1'
        run: |
          xvfb-run --auto-servernum node desktop/scripts/probe.mjs
          xvfb-run --auto-servernum node desktop/scripts/host-probe.mjs
