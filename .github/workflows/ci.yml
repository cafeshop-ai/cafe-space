name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test release Rust workspace
        run: cargo test --locked --workspace --all-targets

      - name: Verify atomic Windows job ownership before process resume
        if: runner.os == 'Windows'
        run: cargo test --locked -p cafe-spaced --lib job_owns_suspended_child_before_the_first_instruction -- --nocapture

      - name: Verify native project identity and root boundaries with raw evidence
        run: cargo test --locked -p cafe-space-ipc project_root::tests -- --test-threads=1 --nocapture

      - name: Check generated protocol bindings
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- web/src/protocol/generated)" ]]; then
            git status --short -- web/src/protocol/generated
            echo "Rust protocol types changed; regenerate and commit the TypeScript bindings."
            exit 1
          fi

      - name: Build Rust workspace natively
        run: cargo build --locked --workspace --all-targets

      - name: Fetch pinned M0 source for binary/schema compatibility
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 3953e33250bee0a41eb2bf220a91043779b3c01e
          path: target/m0-compat-src
          persist-credentials: false

      - name: Build pinned M0 without running it against user state
        run: cargo build --locked --manifest-path target/m0-compat-src/Cargo.toml --target-dir target/m0-compat -p cafe-spaced --bin cafe-spaced-dev

      - name: Fetch pinned schema-v2 source for compatibility
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 01c7fa93bbacae1d14c86cea2786c7fb2e10d808
          path: target/v2-compat-src
          persist-credentials: false

      - name: Build pinned schema-v2 without running it against user state
        run: cargo build --locked --manifest-path target/v2-compat-src/Cargo.toml --target-dir target/v2-compat -p cafe-spaced --bin cafe-spaced-dev

      - name: Verify actual M0 and schema-v2 binaries refuse v3 without data loss
        env:
          CAFE_SPACE_TEST_M0_BINARY: ${{ github.workspace }}/target/m0-compat/debug/cafe-spaced-dev${{ runner.os == 'Windows' && '.exe' || '' }}
          CAFE_SPACE_TEST_V2_BINARY: ${{ github.workspace }}/target/v2-compat/debug/cafe-spaced-dev${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test --locked -p cafe-spaced --test update old_binaries_accept_their_schema_but_refuse_v3_without_overwriting_data -- --ignored --test-threads=1 --nocapture

      - name: Verify Linux data-directory IPC with absent and squatted legacy tmp paths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          uid=$(id -u)
          test "$uid" != 0
          test -d /run/user
          # Hide only inside a fresh private mount namespace; never alter host runtime or tmp paths.
          sudo unshare --mount --propagation private --fork /bin/bash -ceu '
            uid=$1; runner_path=$2; runner_home=$3; cargo_home=$4; rustup_home=$5
            mount -t tmpfs -o mode=0755 tmpfs /run/user
            mount -t tmpfs -o mode=1777 tmpfs /tmp
            project_mounts=$(mktemp -d /tmp/cafe-project-roots.XXXXXX)
            chmod 0755 "$project_mounts"
            mkdir -p "$project_mounts/local/child" "$project_mounts/volume" "$project_mounts/bind"
            mount -t tmpfs -o mode=0755 tmpfs "$project_mounts/volume"
            mkdir "$project_mounts/volume/child"
            mount --bind "$project_mounts/local" "$project_mounts/bind"
            sudo -n -u "#$uid" -- env PATH="$runner_path" HOME="$runner_home" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" \
              RUNNER_ENVIRONMENT=github-hosted CAFE_SPACE_TEST_MOUNTS="$project_mounts" \
              cargo test --locked -p cafe-space-ipc mounted_volume_and_bind_roots_are_rejected_but_children_are_allowed -- --ignored --test-threads=1 --nocapture
            for squatted in 0 1; do
              if [ "$squatted" = 1 ]; then mkdir -m 0700 "/tmp/cafe-space-dev-$uid"; fi
              sudo -n -u "#$uid" -- env PATH="$runner_path" HOME="$runner_home" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" \
                RUNNER_ENVIRONMENT=github-hosted CAFE_SPACE_TEST_RUNTIME_FALLBACK=1 CAFE_SPACE_TEST_SQUATTED_TMP="$squatted" \
                cargo test --locked -p cafe-spaced --test update foreground_without_xdg_runtime_serves_owner_ipc -- --ignored --test-threads=1 --nocapture
            done
          ' m1-ipc-fallback "$uid" "$PATH" "$HOME" "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}"

      - name: Prepare disposable Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"

      - name: Verify per-user login registration on disposable runner
        env:
          CAFE_SPACE_TEST_AUTOSTART: '1'
          CAFE_SPACE_TEST_M0_BINARY: ${{ github.workspace }}/target/m0-compat/debug/cafe-spaced-dev${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test --locked -p cafe-spaced --test autostart -- --ignored --test-threads=1 --nocapture

      - name: Build and typecheck UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
