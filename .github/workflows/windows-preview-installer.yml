name: Windows preview installer

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Validate commit input
        shell: pwsh
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if ($env:COMMIT_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'commit_sha must be a full, lowercase 40-character commit SHA'
          }

      - name: Check out fixed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out commit
        shell: pwsh
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:COMMIT_SHA) {
            throw "Checked out $actual instead of the requested fixed commit"
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Tauri CLI
        run: cargo install --locked tauri-cli --version 2.8.4

      - name: Build and verify fixed-commit Windows bundle
        shell: pwsh
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          node desktop/scripts/package-windows.mjs
          $bundleDir = Join-Path $PWD 'target/windows-bundle'
          if (-not (Test-Path -LiteralPath $bundleDir -PathType Container)) {
            throw 'The Windows packaging script did not create target/windows-bundle.'
          }
          foreach ($file in @('SHA256SUMS.txt', 'manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundleDir $file) -PathType Leaf)) {
              throw "The Windows bundle is missing $file."
            }
          }
          $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter '*.exe' -File -Recurse)
          if ($installers.Count -ne 1) {
            throw 'The Windows bundle must contain exactly one installer executable.'
          }
          $manifest = Get-Content -Raw (Join-Path $bundleDir 'manifest.json') | ConvertFrom-Json
          if ($manifest.commit -cne $env:COMMIT_SHA) {
            throw 'The bundle manifest does not match the requested fixed commit.'
          }
          if ($manifest.target -cne 'x86_64-pc-windows-msvc') {
            throw 'The bundle manifest does not identify the required Windows target.'
          }
          if ($manifest.unsigned -ne $true) {
            throw 'The bundle manifest does not identify an unsigned preview installer.'
          }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.artifacts.Count -ne 1 -or $manifest.artifacts[0].file -cne $installers[0].Name -or $manifest.artifacts[0].sha256 -cne $hash) {
            throw 'The bundle manifest does not match the installer SHA-256.'
          }
          $checksums = @(Get-Content -LiteralPath (Join-Path $bundleDir 'SHA256SUMS.txt'))
          if ($checksums.Count -ne 1 -or $checksums[0] -cne "$hash  $($installers[0].Name)") {
            throw 'SHA256SUMS.txt does not match the installer SHA-256.'
          }

      - name: Upload Windows preview bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-${{ inputs.commit_sha }}
          path: target/windows-bundle/
          if-no-files-found: error
