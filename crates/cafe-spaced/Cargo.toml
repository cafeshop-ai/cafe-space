[package]
name = "cafe-spaced"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cafe-space-adapters = { path = "../adapters" }
cafe-space-ipc = { path = "../ipc" }
cafe-space-protocol = { path = "../protocol" }
tokio = { workspace = true, features = ["sync"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "sync"] }

[[test]]
name = "managed"
path = "tests/managed.rs"
harness = false

[lints]
workspace = true

[[bin]]
name = "cafe-spaced"
path = "src/main.rs"

[[bin]]
name = "cafe-spaced-dev"
path = "src/bin/dev.rs"
