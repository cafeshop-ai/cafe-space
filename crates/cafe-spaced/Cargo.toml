[package]
name = "cafe-spaced"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cafe-space-ipc = { path = "../ipc" }
cafe-space-protocol = { path = "../protocol" }
tokio = { workspace = true, features = ["sync"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "sync"] }

[lints]
workspace = true

[[bin]]
name = "cafe-spaced"
path = "src/main.rs"

[[bin]]
name = "cafe-spaced-dev"
path = "src/bin/dev.rs"
